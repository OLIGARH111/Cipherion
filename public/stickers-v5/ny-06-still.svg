  <path d="M256 318q-30-18-70 8 30 24 70 0zM256 318q30-18 70 8-30 24-70 0z" fill="#fff"/><path d="M240 346q16 12 32 0" stroke="#c4475a" stroke-width="7" stroke-linecap="round" fill="none"/>
