  <path d="M150 236q4-170 160-150 70 10 92 90l-34 0q-20-60-60-70z" fill="url(#red)"/><g class="a float"><circle cx="404" cy="190" r="26" fill="url(#snow)"/></g>
  <rect x="142" y="208" width="228" height="44" rx="22" fill="url(#snow)"/>
  <g class="a blink"><circle cx="224" cy="270" r="10" fill="#1e2a40"/><circle cx="288" cy="270" r="10" fill="#1e2a40"/><circle cx="228" cy="266" r="3.2" fill="#fff"/><circle cx="292" cy="266" r="3.2" fill="#fff"/></g><path d="M216 254q14-10 28 0M268 254q14-10 28 0" stroke="#e8eef8" stroke-width="8" stroke-linecap="round" fill="none"/>
