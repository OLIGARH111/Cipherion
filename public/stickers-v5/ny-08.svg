<radialGradient id="blue" cx="36%" cy="30%" r="80%"><stop offset="0" stop-color="#c9e8ff"/><stop offset=".55" stop-color="#5aa8ff"/><stop offset="1" stop-color="#2c5fd6"/></radialGradient>
