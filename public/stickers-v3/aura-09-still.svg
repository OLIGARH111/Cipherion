<linearGradient id="gem" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d6fbff"/><stop offset=".5" stop-color="#7fd6ff"/><stop offset="1" stop-color="#8a7dff"/></linearGradient>
<linearGradient id="env" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff7fb"/><stop offset="1" stop-color="#ffd6e6"/></linearGradient>
<linearGradient id="mug" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e9f7f0"/><stop offset="1" stop-color="#b9e6d3"/></linearGradient>
<mask id="crescent"><rect width="512" height="512" fill="#fff"/><circle cx="320" cy="200" r="138" fill="#000"/></mask><clipPath id="win"><circle cx="256" cy="256" r="190"/></clipPath><clipPath id="gemclip"><path d="M256 96 380 200 256 420 132 200Z"/></clipPath></defs><g class="a glow" style=""><circle cx="256" cy="256" r="190" fill="url(#halo)"/></g><g class="a wobble" style=""><path d="M256 96 380 200 256 420 132 200Z" fill="url(#gem)"/><path d="M132 200h248M196 200l60-104 60 104-60 220-60-220" fill="none" stroke="#fff" stroke-width="5" stroke-linejoin="round" opacity=".7"/><g clip-path="url(#gemclip)"><g class="a slide" style="animation-duration:2.4s;"><rect x="300" y="60" width="40" height="420" fill="#fff" opacity=".55" transform="rotate(20 320 270)"/></g></g></g><g class="a twinkle" style=""><g transform="translate(400 120) scale(0.9)"><path d="M0-24C3-4 4-3 24 0 4 3 3 4 0 24-3 4-4 3-24 0-4-3-3-4 0-24Z" fill="#d6fbff"/></g></g><g class="a twinkle" style="animation-delay:0.45s;"><g transform="translate(110 330) scale(0.7)"><path d="M0-24C3-4 4-3 24 0 4 3 3 4 0 24-3 4-4 3-24 0-4-3-3-4 0-24Z" fill="#d6fbff"/></g></g><g class="a twinkle" style="animation-delay:0.9s;"><g transform="translate(390 390) scale(0.5)"><path d="M0-24C3-4 4-3 24 0 4 3 3 4 0 24-3 4-4 3-24 0-4-3-3-4 0-24Z" fill="#d6fbff"/></g></g></svg>