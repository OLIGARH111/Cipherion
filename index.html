<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#022c22">
<title>Cipherion</title>
<link rel="stylesheet" href="/style.css?v=20260901-corefix3">
</head>
<body>
<div id="auth-screen" class="auth-screen">
  <div class="auth-box">
    <h1>Cipherion</h1>
    <div class="tabs"><button class="tab active" data-tab="login">Вход</button><button class="tab" data-tab="register">Регистрация</button></div>
    <div id="auth-error" class="auth-error"></div>
    <form id="login-form"><input id="login-username" required><input id="login-password" type="password" required><input id="login-cloud-password" type="password"><button type="submit">Войти</button></form>
    <form id="register-form" class="hidden"><input id="reg-username" required><input id="reg-password" type="password" required><input id="reg-phone" required><input id="reg-email" type="email"><button type="button" id="reg-send-code">Получить код</button><input id="reg-phone-code"><span id="reg-code-hint"></span><button type="submit">Зарегистрироваться</button></form>
  </div>
</div>
<div id="app-screen" class="app-screen hidden">
  <aside class="sidebar">
    <div class="sidebar-header"><button id="menu-btn">☰</button><h2>Чаты</h2></div>
    <input id="user-search" placeholder="Поиск">
    <div id="chats-list" class="list"></div>
    <div id="users-list" class="list"></div>
  </aside>
  <main class="chat-area">
    <div id="no-chat" class="no-chat"><div class="no-chat-content"><div class="no-chat-icon">💬</div><p>Выберите чат</p></div></div>
    <div id="chat-view" class="hidden"><header class="chat-header"><button id="back-btn">←</button><h3 id="chat-title"></h3></header><div id="messages" class="messages"></div><form id="message-form"><input id="message-input"><button type="submit">Отправить</button></form></div>
  </main>
</div>
<script src="/ws-bridge.js?v=20260901-corefix3"></script>
<script src="/app.js?v=20260901-corefix3"></script>
</body>
</html>
