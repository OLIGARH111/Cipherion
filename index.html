<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#022c22">
<title>Cipherion</title>
<link rel="stylesheet" href="/style.css?v=20260901-emerald1">
<link rel="stylesheet" href="/emerald-theme.css?v=20260901-emerald1">
<style>#auth-screen.hidden{display:none!important}#app-screen{display:flex;height:100vh;width:100%}#app-screen.hidden{display:none!important}</style>
</head>
<body>
<div id="auth-screen" class="auth-screen"><div class="auth-box"><h1>Cipherion</h1><div class="tabs"><button class="tab active" data-tab="login">Вход</button><button class="tab" data-tab="register">Регистрация</button></div><div id="auth-error" class="auth-error error"></div><form id="login-form"><input id="login-username" placeholder="Имя пользователя" autocomplete="username" required><input id="login-password" type="password" placeholder="Пароль" autocomplete="current-password" required><input id="login-cloud-password" type="password" placeholder="Облачный пароль (если есть)"><button type="submit">Войти</button></form><form id="register-form" class="hidden"><input id="reg-username" placeholder="Имя пользователя" autocomplete="username" required minlength="3"><input id="reg-password" type="password" placeholder="Пароль (мин. 4 символа)" autocomplete="new-password" required minlength="4"><button type="submit">Зарегистрироваться</button></form></div></div>
<div id="app-screen" class="app-screen hidden"><aside class="sidebar"><div class="sidebar-header"><button id="menu-btn" type="button">☰</button><h2>Чаты</h2><button id="logout-btn" type="button" style="margin-left:auto;background:transparent;border:0;color:#86a69d;font-size:13px;cursor:pointer">Выйти</button></div><div class="search-box-header"><input id="user-search" placeholder="Поиск"></div><div class="section-title">Чаты</div><div id="chats-list" class="list"></div><div class="section-title">Пользователи</div><div id="users-list" class="list"></div></aside><main class="chat-area"><div id="no-chat" class="no-chat"><div class="no-chat-content"><div class="no-chat-icon">💬</div><p>Выберите чат или пользователя</p></div></div><div id="chat-view" class="hidden"><header class="chat-header"><button id="back-btn" type="button">←</button><h3 id="chat-title"></h3></header><div id="messages" class="messages"></div><form id="message-form"><input id="message-input" placeholder="Сообщение" autocomplete="off"><button type="submit">➤</button></form></div></main></div>
<nav id="classic-bottom-nav"><button class="active" type="button"><span>💬</span>Чаты</button><button type="button"><span>👥</span>Контакты</button><button type="button" id="bottom-settings"><span>⚙️</span>Настройки</button></nav>
<script src="/ws-bridge.js?v=20260901-emerald1"></script><script src="/app.js?v=20260901-emerald1"></script>
</body></html>
