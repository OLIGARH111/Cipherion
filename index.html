<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#022c22">
<title>Cipherion</title>
<link rel="stylesheet" href="/style.css?v=20260901-corefix2">
</head>
<body>
<div id="auth-screen" class="screen">
  <div class="auth-box">
    <h1>Cipherion</h1>
    <div class="tabs">
      <button class="tab active" data-tab="login">Вход</button>
      <button class="tab" data-tab="register">Регистрация</button>
    </div>
    <form id="login-form">
      <input type="text" id="login-username" placeholder="Имя пользователя" required autocomplete="username">
      <input type="password" id="login-password" placeholder="Пароль" required autocomplete="current-password">
      <input type="password" id="login-cloud-password" placeholder="Облачный пароль (если включён)" autocomplete="current-password">
      <button type="submit">Войти</button>
    </form>
    <form id="register-form" class="hidden">
      <input type="text" id="reg-username" placeholder="Логин" required autocomplete="username">
      <input type="tel" id="reg-phone" placeholder="Номер телефона" required autocomplete="tel">
      <div class="phone-code-row">
        <button type="button" id="reg-send-code" class="btn-secondary">Получить код</button>
        <input type="text" id="reg-phone-code" placeholder="Код из SMS" required maxlength="6">
      </div>
      <p id="reg-code-hint" class="photo-hint"></p>
      <input type="email" id="reg-email" placeholder="Электронная почта" required autocomplete="email">
      <input type="password" id="reg-password" placeholder="Пароль (минимум 4 символа)" required autocomplete="new-password">
      <button type="submit">Зарегистрироваться</button>
    </form>
    <p id="auth-error" class="error"></p>
  </div>
</div>

<div id="app-screen" class="screen hidden">
  <div id="drawer-overlay" class="drawer-overlay hidden"></div>
  <nav id="drawer" class="drawer">
    <div class="drawer-profile">
      <div class="drawer-avatar" id="drawer-avatar">
        <span id="drawer-avatar-letter">?</span>
        <img id="drawer-avatar-img" class="hidden" alt="">
      </div>
      <div class="drawer-user-info">
        <div class="drawer-username" id="drawer-username"></div>
        <div class="drawer-status">в сети</div>
      </div>
    </div>
    <div class="drawer-menu">
      <button class="drawer-item" id="menu-new-group"><span class="drawer-icon">👥</span><span>Создать группу</span></button>
      <button class="drawer-item" id="menu-new-channel"><span class="drawer-icon">📢</span><span>Создать канал</span></button>
      <button class="drawer-item" id="menu-saved"><span class="drawer-icon">💾</span><span>Избранное</span></button>
      <button class="drawer-item" id="menu-settings"><span class="drawer-icon">👤</span><span>Мой профиль</span></button>
      <button class="drawer-item drawer-item-vip" id="menu-vip"><span class="drawer-icon">👑</span><span>Cipherion VIP</span><span class="vip-badge-menu hidden" id="vip-menu-badge">VIP</span></button>
      <button class="drawer-item" id="menu-app-settings" style="display:none"><span class="drawer-icon">⚙️</span><span>Настройки</span></button>
      <div class="drawer-divider"></div>
      <button class="drawer-item" id="menu-theme"><span class="drawer-icon" id="theme-icon">☀️</span><span id="theme-label">Светлый режим</span></button>
      <div class="drawer-divider"></div>
      <button class="drawer-item drawer-item-danger" id="logout-btn"><span class="drawer-icon">🚪</span><span>Выйти</span></button>
    </div>
    <div class="drawer-footer"><span>Cipherion</span></div>
  </nav>

  <aside class="sidebar">
    <div id="stories-row" class="stories-row"></div>
    <div class="sidebar-header">
      <button id="menu-btn" class="menu-btn" title="Меню" style="display:none"><span></span><span></span><span></span></button>
      <div class="search-box-header"><input type="text" id="user-search" placeholder="Поиск"></div>
    </div>
    <div class="chats-page-title">Чаты</div>
    <div class="section-title section-title-chats" style="display:none">Чаты</div>
    <div id="chats-list" class="list"></div>
    <div class="section-title section-title-users">Контакты</div>
    <div id="users-list" class="list"></div>
  </aside>

  <main class="chat-area">
    <div id="no-chat" class="no-chat"><div class="no-chat-content"><div class="no-chat-icon">💬</div><p>Выберите чат</p></div></div>
    <div id="chat-view" class="hidden">
      <header class="chat-header"><button id="back-btn" class="back-btn" title="Назад">←</button><h3 id="chat-title" class="chat-title-clickable"></h3><button id="chat-info-btn" class="chat-info-btn hidden" title="Инфо">⋮</button></header>
      <div id="messages" class="messages"></div><div id="sticker-panel" class="sticker-panel hidden"></div>
      <form id="message-form" class="message-form"><button type="button" id="attach-btn" class="attach-btn" title="Прикрепить">📎</button><div class="composer-field"><input type="text" id="message-input" placeholder="Сообщение" autocomplete="off"><button type="button" id="sticker-btn" class="attach-btn" title="Стикеры">😊</button></div><button type="button" id="voice-btn" class="voice-btn" title="Голосовое">🎤</button><button type="button" id="send-main-btn" title="Отправить" aria-label="Отправить">✈</button><div id="recording-indicator" class="recording-indicator hidden"><span class="rec-dot"></span><span id="rec-timer">0:00</span><button type="button" id="cancel-rec-btn" title="Отменить">✕</button><button type="button" id="send-rec-btn" class="send-rec-btn" title="Отправить" style="display:none">➤</button></div><button type="button" id="video-note-btn" class="attach-btn" title="Кружок" style="display:none">📷</button><input type="file" id="image-input" accept="image/*" hidden><button type="submit" title="Отправить" style="display:none"></button></form>
    </div>
  </main>
</div>

<nav class="mobile-bottom-nav" id="mobile-bottom-nav" aria-label="Навигация" style="display:none"><button class="mobile-nav-item active" data-mobile-view="chats"><span class="nav-icon">💬</span><span>Чаты</span></button><button class="mobile-nav-item" data-mobile-view="calls"><span class="nav-icon">📞</span><span>Звонки</span></button><button class="mobile-nav-item" data-mobile-view="contacts"><span class="nav-icon">👥</span><span>Контакты</span></button><button class="mobile-nav-item" data-mobile-view="settings"><span class="nav-icon">⚙️</span><span>Настройки</span></button></nav>

<div id="group-modal" class="modal hidden"><div class="modal-box"><h3>Создать группу</h3><input type="text" id="group-name" placeholder="Название группы"><div id="group-users-list" class="group-users-list"></div><div class="modal-actions"><button id="group-cancel" class="btn-secondary">Отмена</button><button id="group-create" class="btn-primary">Создать</button></div></div></div>
<div id="channel-modal" class="modal hidden"><div class="modal-box"><h3>Создать канал</h3><input type="text" id="channel-name" placeholder="Название канала"><textarea id="channel-desc" rows="3" placeholder="Описание" maxlength="500"></textarea><div class="modal-actions"><button id="channel-cancel" class="btn-secondary">Отмена</button><button id="channel-create" class="btn-primary">Создать</button></div></div></div>
<div id="settings-modal" class="modal hidden"><div class="modal-box settings-box"><h3>Мой профиль</h3><div class="profile-photo-section"><div class="profile-photo-preview" id="profile-photo-preview"><span id="profile-letter">?</span><img id="profile-img" class="hidden" alt=""></div><div class="profile-photo-actions"><label class="btn-primary photo-upload-btn">Выбрать фото<input type="file" id="avatar-input" accept="image/*" hidden></label><button type="button" id="remove-avatar-btn" class="btn-secondary hidden">Удалить</button></div></div><div class="settings-field"><label>Логин</label><input type="text" id="settings-username" readonly></div><div class="settings-field"><label>@ник</label><div class="handle-input"><span class="handle-prefix">@</span><input type="text" id="settings-handle" maxlength="50"></div></div><div class="settings-field"><label>Телефон</label><input type="tel" id="settings-phone"></div><div class="settings-field"><label>Почта</label><input type="email" id="settings-email"></div><div class="settings-field"><label>О себе</label><textarea id="settings-bio" rows="3" maxlength="300"></textarea></div><div class="settings-field"><label>День рождения</label><input type="date" id="settings-birthday"></div><div class="modal-actions"><button id="settings-close" class="btn-secondary">Отмена</button><button id="settings-save" class="btn-primary">Сохранить</button></div></div></div>
<div id="group-settings-modal" class="modal hidden"><div class="modal-box settings-box"><h3>Настройки группы</h3><div class="profile-photo-section"><div class="profile-photo-preview" id="group-photo-preview"><span id="group-letter">?</span><img id="group-img" class="hidden" alt=""></div><div class="profile-photo-actions"><label class="btn-primary photo-upload-btn">Фото<input type="file" id="group-avatar-input" accept="image/*" hidden></label></div></div><div class="settings-field"><label>Название</label><input type="text" id="group-settings-name"></div><div class="settings-field"><label>Описание</label><textarea id="group-settings-desc" rows="2" maxlength="500"></textarea></div><div class="settings-field"><label>Тип</label><select id="group-settings-type"><option value="private">Частная</option><option value="public">Публичная</option></select></div><div class="settings-field"><label>Реакции</label><input type="text" id="group-settings-reactions"></div><div id="group-members-list" class="group-users-list"></div><div id="group-add-users-list" class="group-users-list"></div><div id="group-admins-list" class="group-users-list"></div><button type="button" id="group-start-call" class="btn-primary" style="width:100%;margin:12px 0">Видеочат</button><button type="button" id="group-delete-btn" class="btn-secondary" style="width:100%;margin-bottom:12px;color:#f87171">Удалить</button><div class="modal-actions"><button id="group-settings-cancel" class="btn-secondary">Закрыть</button><button id="group-settings-save" class="btn-primary">Сохранить</button></div></div></div>
<div id="app-settings-modal" class="modal hidden" style="display:none!important" aria-hidden="true"></div>
<div id="vip-modal" class="modal hidden"><div class="modal-box vip-box"><div class="vip-header"><button type="button" id="vip-close-x" class="modal-close-x">×</button><div class="vip-crown">👑</div><h3>Cipherion VIP</h3></div><ul class="vip-features"><li>VIP-функции</li></ul><div id="vip-status-active" class="vip-status active hidden"><p>VIP активен</p><div class="emoji-status-picker" id="emoji-status-picker"></div><input type="text" id="vip-emoji-status" maxlength="4"><button id="vip-save-status" class="btn-primary" style="width:100%;margin:8px 0">Сохранить</button><button id="vip-add-story" class="btn-primary" style="width:100%;margin-bottom:8px">История</button><button id="vip-deactivate-btn" class="btn-secondary">Отключить</button></div><div id="vip-status-inactive" class="vip-status"><button id="vip-activate-btn" class="btn-vip">Активировать VIP</button></div><div class="modal-actions"><button id="vip-close" class="btn-secondary">Закрыть</button></div></div></div>
<div id="story-viewer" class="story-viewer hidden"><div class="story-viewer-inner"><div class="story-progress" id="story-progress"></div><button type="button" id="story-viewer-close" class="story-viewer-close">×</button><div class="story-viewer-meta"><span id="story-viewer-name"></span><span id="story-viewer-time"></span></div><div class="story-viewer-body" id="story-viewer-body"></div><div class="story-reactions-bar"><button type="button" data-re="❤️">❤️</button><button type="button" data-re="🔥">🔥</button><button type="button" data-re="😂">😂</button><button type="button" data-re="😮">😮</button><button type="button" data-re="😢">😢</button><button type="button" data-re="👏">👏</button></div><div class="story-reply-bar"><input type="text" id="story-reply-input" placeholder="Комментарий…"><button type="button" id="story-reply-send">➤</button></div><div id="story-reply-tip" class="story-reply-tip hidden">Отправлено</div><div class="story-viewer-nav"><button type="button" id="story-prev">‹</button><button type="button" id="story-next">›</button></div></div></div>
<div id="story-compose-modal" class="modal hidden"><div class="modal-box"><h3>История</h3><div class="story-font-toolbar"><button type="button" class="font-btn active" data-font="default">Обычный</button><button type="button" class="font-btn" data-font="serif">Serif</button><button type="button" class="font-btn" data-font="mono">Mono</button><button type="button" class="font-btn" data-font="hand">Рукопись</button><button type="button" class="font-btn" data-font="bold">Жирный</button></div><textarea id="story-compose-text" rows="4" maxlength="500"></textarea><div class="story-pos-controls"><label>X <input type="range" id="story-text-x" min="5" max="95" value="50"></label><label>Y <input type="range" id="story-text-y" min="5" max="95" value="70"></label></div><div class="story-compose-preview" id="story-compose-preview"><div class="story-compose-preview-text" id="story-compose-preview-text">Текст</div></div><div class="story-compose-stickers" id="story-compose-stickers"></div><input type="hidden" id="story-compose-sticker" value=""><input type="file" id="story-compose-file" accept="image/*"><div class="modal-actions"><button type="button" id="story-compose-cancel" class="btn-secondary">Отмена</button><button type="button" id="story-compose-send" class="btn-primary">Опубликовать</button></div></div></div>
<div id="video-note-overlay" class="video-note-overlay hidden"><div class="video-note-box"><video id="video-note-preview" autoplay muted playsinline></video><div class="video-note-timer" id="video-note-timer">0:00</div><div class="video-note-actions"><button type="button" id="video-note-cancel" class="btn-secondary">Отмена</button><button type="button" id="video-note-stop" class="btn-primary">Отправить</button></div></div></div>

<script src="/ws-bridge.js?v=20260901-corefix2"></script>
<script src="/app.js?v=20260901-corefix2"></script>
</body>
</html>
