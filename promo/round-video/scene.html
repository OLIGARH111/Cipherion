<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Cipherion — видео-кружочки</title>
<style>html,body{margin:0;background:#070c13}canvas{display:block;width:540px;height:960px}</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// Promo for video notes ("кружочки"). Every frame is a pure function of time, so the
// recorder (record.mjs) can step through it frame by frame: window.frame(t).
const W=1080,H=1920,DURATION=27;
const ACCENT='#83d9b5',VIOLET='#6559d5',BG='#070c13',INK='#062016';
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const logo=new Image();logo.src='../../public/brand/icon-512-99e4c7990351.png';

const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const ease=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const out=x=>1-Math.pow(1-x,3);
const back=x=>{const c=1.6;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2);};
const lerp=(a,b,k)=>a+(b-a)*k;
const clock=s=>{s=Math.max(0,Math.floor(s));return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;};
const font=(size,weight=500)=>`${weight} ${size}px Inter, system-ui, sans-serif`;

function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);}
function circle(x,y,r){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);}
function text(s,x,y,{size=16,weight=500,color='#fff',align='left',alpha=1,base='alphabetic'}={}){ctx.save();ctx.globalAlpha*=alpha;ctx.font=font(size,weight);ctx.fillStyle=color;ctx.textAlign=align;ctx.textBaseline=base;ctx.fillText(s,x,y);ctx.restore();}
function wrap(s,max,size,weight){ctx.font=font(size,weight);const words=s.split(' '),lines=[];let line='';for(const w of words){const next=line?line+' '+w:w;if(ctx.measureText(next).width>max&&line){lines.push(line);line=w;}else line=next;}if(line)lines.push(line);return lines;}

// ---------- icons (24-unit grid, stroked) ----------
function icon(name,x,y,size,color){
  ctx.save();ctx.translate(x-size/2,y-size/2);ctx.scale(size/24,size/24);ctx.strokeStyle=color;ctx.fillStyle=color;ctx.lineWidth=2;ctx.lineCap='round';ctx.lineJoin='round';
  const p=new Path2D();
  if(name==='mic'){p.roundRect(9,3,6,11,3);p.moveTo(5,11);p.bezierCurveTo(5,18,19,18,19,11);p.moveTo(12,17.5);p.lineTo(12,21);ctx.stroke(p);}
  else if(name==='video'){p.roundRect(3,6.5,12,11,2.5);p.moveTo(15,10.5);p.lineTo(21,7.5);p.lineTo(21,16.5);p.lineTo(15,13.5);ctx.stroke(p);}
  else if(name==='lock'){p.roundRect(5,11,14,10,2.5);p.moveTo(8,11);p.lineTo(8,8);p.bezierCurveTo(8,2.7,16,2.7,16,8);p.lineTo(16,11);ctx.stroke(p);}
  else if(name==='send'){p.moveTo(12,19);p.lineTo(12,5);p.moveTo(6,11);p.lineTo(12,5);p.lineTo(18,11);ctx.lineWidth=2.6;ctx.stroke(p);}
  else if(name==='close'){p.moveTo(6,6);p.lineTo(18,18);p.moveTo(18,6);p.lineTo(6,18);ctx.stroke(p);}
  else if(name==='speakeroff'){p.moveTo(4,9.5);p.lineTo(8,9.5);p.lineTo(12.5,5.5);p.lineTo(12.5,18.5);p.lineTo(8,14.5);p.lineTo(4,14.5);p.closePath();p.moveTo(16,9.5);p.lineTo(21,14.5);p.moveTo(21,9.5);p.lineTo(16,14.5);ctx.stroke(p);}
  else if(name==='check'){p.moveTo(4,12.5);p.lineTo(9,17.5);p.lineTo(20,6.5);ctx.stroke(p);}
  else if(name==='checks'){p.moveTo(2,12.5);p.lineTo(7,17.5);p.lineTo(17,7);p.moveTo(11,16.5);p.lineTo(12,17.5);p.lineTo(22,7);ctx.stroke(p);}
  else if(name==='clip'){p.moveTo(20,11.5);p.lineTo(12.5,19);p.bezierCurveTo(9,22.5,3.5,17,7,13.5);p.lineTo(14.5,6);p.bezierCurveTo(17,3.5,20.5,7,18,9.5);p.lineTo(10.5,17);p.bezierCurveTo(9.3,18.2,7.8,16.7,9,15.5);p.lineTo(15.5,9);ctx.stroke(p);}
  else if(name==='back'){p.moveTo(15,5);p.lineTo(8,12);p.lineTo(15,19);ctx.lineWidth=2.4;ctx.stroke(p);}
  else if(name==='text'){p.moveTo(5,7);p.lineTo(19,7);p.moveTo(5,12);p.lineTo(19,12);p.moveTo(5,17);p.lineTo(13,17);ctx.stroke(p);}
  else if(name==='play'){p.moveTo(8,5);p.lineTo(19,12);p.lineTo(8,19);p.closePath();ctx.fill(p);}
  ctx.restore();
}

// ---------- the "camera": an illustrated friend filming a sunset ----------
function friend(cx,cy,r,time,{talk=0,mirror=false}={}){
  ctx.save();circle(cx,cy,r);ctx.clip();ctx.translate(cx,cy);if(mirror)ctx.scale(-1,1);const s=r/100;ctx.scale(s,s);
  // sky + sun + sea
  let g=ctx.createLinearGradient(0,-100,0,100);g.addColorStop(0,'#2a2f6b');g.addColorStop(.45,'#c0607a');g.addColorStop(.62,'#f3a66a');g.addColorStop(.63,'#3b4f86');g.addColorStop(1,'#1b2346');
  ctx.fillStyle=g;ctx.fillRect(-100,-100,200,200);
  const sunY=22+Math.sin(time*.4)*2;g=ctx.createRadialGradient(-38,sunY,0,-38,sunY,40);g.addColorStop(0,'#fff3c4');g.addColorStop(.35,'#ffc46b');g.addColorStop(1,'#ffc46b00');ctx.fillStyle=g;circle(-38,sunY,40);ctx.fill();
  ctx.fillStyle='#ffe2a0';circle(-38,sunY,13);ctx.fill();
  ctx.strokeStyle='#ffd99a88';ctx.lineWidth=1.6;for(let i=0;i<5;i++){const y=31+i*6,w=26-i*4,o=Math.sin(time*2+i)*3;ctx.beginPath();ctx.moveTo(-38-w+o,y);ctx.lineTo(-38+w+o,y);ctx.stroke();}
  // camera sway
  ctx.translate(Math.sin(time*1.3)*2.5,Math.sin(time*1.9)*1.8);ctx.rotate(Math.sin(time*.9)*.025);
  // body
  ctx.fillStyle='#2f8f78';ctx.beginPath();ctx.moveTo(-70,110);ctx.bezierCurveTo(-66,62,-36,50,0,50);ctx.bezierCurveTo(36,50,66,62,70,110);ctx.fill();
  ctx.fillStyle='#e9b994';rr(-11,28,22,26,8);ctx.fill();
  // waving hand
  const wave=Math.sin(time*7)*.35*clamp(Math.sin(time*.8)*2);ctx.save();ctx.translate(48,62);ctx.rotate(-.5+wave);ctx.fillStyle='#2f8f78';rr(-9,-48,18,52,9);ctx.fill();ctx.fillStyle='#e9b994';circle(0,-52,11);ctx.fill();ctx.restore();
  // head
  ctx.fillStyle='#3a2418';ctx.beginPath();ctx.ellipse(0,-6,36,40,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#f1c6a2';ctx.beginPath();ctx.ellipse(0,2,29,33,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#3a2418';ctx.beginPath();ctx.moveTo(-31,-6);ctx.bezierCurveTo(-28,-36,24,-42,32,-8);ctx.bezierCurveTo(14,-22,-8,-24,-31,-6);ctx.fill();
  // eyes (blink every ~3s)
  const blink=(time%3.1)<.12?.15:1;ctx.fillStyle='#2b1a12';for(const x of[-11,11]){ctx.beginPath();ctx.ellipse(x,0,3.4,4.2*blink,0,0,Math.PI*2);ctx.fill();}
  ctx.fillStyle='#e88f86aa';for(const x of[-18,18]){circle(x,12,5);ctx.fill();}
  // mouth
  const open=talk*clamp(.25+.75*Math.abs(Math.sin(time*11)*Math.sin(time*4.3)));ctx.fillStyle='#8a3434';ctx.beginPath();ctx.ellipse(0,17,8,1.8+open*6,0,0,Math.PI*2);ctx.fill();
  if(open<.1){ctx.strokeStyle='#8a3434';ctx.lineWidth=2.2;ctx.beginPath();ctx.arc(0,12,8,.3,Math.PI-.3);ctx.stroke();}
  ctx.restore();
}

// ring along the rim: base track + accent progress from 12 o'clock
function ring(cx,cy,r,progress,{track='#ffffff2e',width=4,alpha=1}={}){
  ctx.save();ctx.globalAlpha*=alpha;ctx.lineCap='round';ctx.lineWidth=width;ctx.strokeStyle=track;circle(cx,cy,r);ctx.stroke();
  if(progress>0){ctx.strokeStyle=ACCENT;ctx.shadowColor=ACCENT;ctx.shadowBlur=10;ctx.beginPath();ctx.arc(cx,cy,r,-Math.PI/2,-Math.PI/2+Math.PI*2*clamp(progress));ctx.stroke();}
  ctx.restore();
}

function finger(x,y,press,alpha){
  if(alpha<=0)return;ctx.save();ctx.globalAlpha*=alpha;
  const r=26-press*5;ctx.fillStyle='#ffffff40';circle(x,y,r+10+press*16);ctx.fill();ctx.fillStyle='#ffffffd8';circle(x,y,r);ctx.fill();ctx.restore();
}
function ripple(x,y,k,color='#ffffff'){if(k<=0||k>=1)return;ctx.save();ctx.globalAlpha*=(1-k)*.6;ctx.strokeStyle=color;ctx.lineWidth=3;circle(x,y,18+k*60);ctx.stroke();ctx.restore();}

// ---------- phone ----------
// Everything inside the phone is laid out in CSS pixels of a 390×780 screen.
const PW=390,PH=780,PS=1.74,PX=(W-PW*PS)/2,PY=500;
const toScreen=(x,y)=>[PX+x*PS,PY+y*PS];

function bubble(x,y,w,h,own){ctx.fillStyle=own?'#25594a':'#1a2230';rr(x,y,w,h,18);ctx.fill();}

function chatScreen(t,st){
  // wallpaper
  let g=ctx.createLinearGradient(0,0,0,PH);g.addColorStop(0,'#0c141d');g.addColorStop(1,'#0a1118');ctx.fillStyle=g;ctx.fillRect(0,0,PW,PH);
  g=ctx.createRadialGradient(330,90,0,330,90,300);g.addColorStop(0,'#83d9b522');g.addColorStop(1,'#83d9b500');ctx.fillStyle=g;ctx.fillRect(0,0,PW,PH);
  g=ctx.createRadialGradient(30,700,0,30,700,300);g.addColorStop(0,'#2bb5c91a');g.addColorStop(1,'#2bb5c900');ctx.fillStyle=g;ctx.fillRect(0,0,PW,PH);
  // status + header
  text('9:41',30,30,{size:15,weight:600});
  ctx.save();ctx.fillStyle='#ffffff';rr(334,20,24,12,3);ctx.globalAlpha*=.85;ctx.fill();ctx.restore();
  ctx.fillStyle='#101a24ee';ctx.fillRect(0,44,PW,62);
  icon('back',22,75,22,ACCENT);
  g=ctx.createLinearGradient(46,56,84,94);g.addColorStop(0,'#f3a66a');g.addColorStop(1,'#c0607a');ctx.fillStyle=g;circle(64,75,19);ctx.fill();
  text('А',64,81,{size:17,weight:700,align:'center'});
  text('Аня',94,70,{size:16,weight:600});text('в сети',94,89,{size:13,color:ACCENT});
  icon('video',350,75,22,'#ffffffaa');
  ctx.fillStyle='#ffffff10';ctx.fillRect(0,105,PW,1);

  // conversation scrolls up as new things arrive
  ctx.save();ctx.beginPath();ctx.rect(0,106,PW,PH-106-74);ctx.clip();
  ctx.translate(0,-st.scroll);
  pill('Сегодня',PW/2,140);
  bubble(16,170,236,62,false);text('Ты где? Пропадаешь весь вечер',30,195,{size:15});text('Мне кажется, что-то красивое :)',30,216,{size:15,color:'#ffffffcc'});text('19:02',238,226,{size:11,color:'#ffffff66',align:'right'});
  bubble(214,244,160,42,true);text('Сейчас покажу :)',228,270,{size:15});
  bubble(16,298,176,42,false);text('Жду кружочек!',30,324,{size:15});text('19:03',178,333,{size:11,color:'#ffffff66',align:'right'});
  st.chat?.();
  ctx.restore();

  // composer
  ctx.fillStyle='#0f1821';ctx.fillRect(0,PH-74,PW,74);ctx.fillStyle='#ffffff10';ctx.fillRect(0,PH-74,PW,1);
  icon('clip',30,PH-40,22,'#ffffff88');
  ctx.fillStyle='#1a2532';rr(54,PH-61,262,42,21);ctx.fill();text('Сообщение',72,PH-34,{size:15,color:'#ffffff66'});
  const [rx,ry]=[350,PH-40];ctx.fillStyle=st.recPressed?ACCENT:'#1f3a33';circle(rx,ry,23+(st.recPressed||0)*6);ctx.fill();
  const m=st.modeMorph;if(m<1)icon('mic',rx,ry,22*(1-m*.4),st.recPressed?INK:ACCENT);if(m>0){ctx.save();ctx.globalAlpha*=m;icon('video',rx,ry,22*(.6+m*.4),st.recPressed?INK:ACCENT);ctx.restore();}
  if(st.recRipple)ripple(rx,ry,st.recRipple,ACCENT);
}

function pill(s,x,y){ctx.font=font(12.5,600);const w=ctx.measureText(s).width+22;ctx.fillStyle='#ffffff14';rr(x-w/2,y-12,w,24,12);ctx.fill();text(s,x,y+4.5,{size:12.5,weight:600,align:'center',color:'#ffffffb0'});}

function toast(s,k){if(k<=0)return;ctx.save();ctx.globalAlpha*=k;ctx.translate(0,(1-k)*16);ctx.font=font(14,600);const w=ctx.measureText(s).width+40;ctx.fillStyle='#1f2b38f2';rr(PW/2-w/2,PH-136,w,42,21);ctx.fill();ctx.strokeStyle='#83d9b555';ctx.lineWidth=1;ctx.stroke();text(s,PW/2,PH-109.5,{size:14,weight:600,align:'center'});ctx.restore();}

// The video note as a chat message: muted loop, duration + muted badge; grows while playing.
function chatNote(cx,cy,r,time,{playing=0,progress=0,remaining=27,paused=0,talk=0,status='sent'}={}){
  ctx.save();ctx.shadowColor='#0007';ctx.shadowBlur=24*playing;ctx.shadowOffsetY=10*playing;ctx.fillStyle='#141c18';circle(cx,cy,r);ctx.fill();ctx.restore();
  friend(cx,cy,r,time,{talk});
  ctx.save();ctx.strokeStyle=`rgba(131,217,181,${.5-.25*playing})`;ctx.lineWidth=3;circle(cx,cy,r+1.5);ctx.stroke();ctx.restore();
  if(playing>0)ring(cx,cy,r+6,progress,{track:'transparent',width:2.6,alpha:playing});
  // duration badge
  const label=clock(remaining);ctx.font=font(12,500);const w=ctx.measureText(label).width+16;
  const bx=cx-r*.62,by=cy+r*.78;ctx.fillStyle='#0009';rr(bx-w/2,by-9,w,18,9);ctx.fill();text(label,bx,by+4,{size:12,align:'center'});
  if(playing<1){ctx.save();ctx.globalAlpha*=1-playing;ctx.fillStyle='#0009';circle(cx+r*.62,by,12);ctx.fill();icon('speakeroff',cx+r*.62,by,14,'#fff');ctx.restore();}
  if(paused>0){ctx.save();ctx.globalAlpha*=paused;ctx.fillStyle='#0008';circle(cx,cy,34);ctx.fill();icon('play',cx+3,cy,34,'#fff');ctx.restore();}
  // time + status under the note
  ctx.save();ctx.globalAlpha*=1-playing*.4;ctx.font=font(11,500);ctx.fillStyle='#0008';rr(cx+r-62,cy+r-12,62,20,10);ctx.fill();text('19:04',cx+r-44,cy+r+2,{size:11,align:'center',color:'#ffffffcc'});
  icon(status==='sent'?'checks':'check',cx+r-16,cy+r-2,13,status==='sent'?ACCENT:'#ffffffaa');ctx.restore();
}

// ---------- the recorder overlay ----------
function recorder(t,k,st){
  if(k<=0)return;ctx.save();ctx.globalAlpha*=k;
  ctx.fillStyle='#000000c4';ctx.fillRect(0,0,PW,PH);
  const D=335*lerp(.7,1,out(k)),cx=PW/2,cy=318,r=D/2;
  ctx.save();ctx.shadowColor='#0009';ctx.shadowBlur=40;ctx.shadowOffsetY=16;ctx.fillStyle='#111';circle(cx,cy,r);ctx.fill();ctx.restore();
  friend(cx,cy,r,t,{talk:st.talk,mirror:true});
  ring(cx,cy,r+9,st.progress,{width:3});
  // REC dot
  ctx.save();ctx.fillStyle='#ff5b5b';ctx.globalAlpha*=.55+.45*Math.abs(Math.sin(t*3));circle(cx-30,cy+r+44,5);ctx.fill();ctx.restore();
  text(clock(st.seconds),cx+6,cy+r+51,{size:20,weight:600,align:'center'});
  const hint=st.locked?'Запись закреплена':'Отпустите, чтобы отправить · Влево — отмена · Вверх — закрепить';
  wrap(hint,300,13,500).forEach((line,i)=>text(line,cx,cy+r+80+i*18,{size:13,color:'#ffffffb0',align:'center'}));
  const ay=cy+r+150;
  ctx.fillStyle='#ff5b5b33';circle(cx-94,ay,29);ctx.fill();icon('close',cx-94,ay,24,'#ff9c9c');
  ctx.save();ctx.globalAlpha*=st.locked?.35:1;ctx.fillStyle='#ffffff1f';circle(cx,ay,29);ctx.fill();icon('lock',cx,ay,24,'#fff');ctx.restore();
  ctx.fillStyle=ACCENT;circle(cx+98,ay,33-st.sendPress*4);ctx.fill();icon('send',cx+98,ay,24,INK);
  if(st.sendRipple)ripple(cx+98,ay,st.sendRipple,ACCENT);
  ctx.restore();
  return {cx,cy,r,ay};
}

function phone(t,draw){
  ctx.save();ctx.translate(PX,PY);ctx.scale(PS,PS);
  ctx.save();ctx.shadowColor='#000';ctx.shadowBlur=60;ctx.shadowOffsetY=30;ctx.fillStyle='#1b222c';rr(-12,-12,PW+24,PH+24,58);ctx.fill();ctx.restore();
  ctx.strokeStyle='#3a4452';ctx.lineWidth=1.5;rr(-12,-12,PW+24,PH+24,58);ctx.stroke();
  ctx.save();rr(0,0,PW,PH,48);ctx.clip();draw();
  ctx.fillStyle='#000';rr(PW/2-60,10,120,32,16);ctx.fill();
  ctx.restore();ctx.restore();
}

// ---------- captions ----------
function caption(t,list){
  for(const c of list){const k=Math.min(seg(t,c.a,c.a+.45),1-seg(t,c.b-.35,c.b));if(k<=0)continue;
    ctx.save();ctx.globalAlpha*=k;const dy=(1-out(k))*24;
    text(c.kicker,W/2,140+dy,{size:28,weight:700,color:ACCENT,align:'center'});
    const lines=wrap(c.title,960,58,800);lines.forEach((l,i)=>text(l,W/2,214+dy+i*68,{size:58,weight:800,align:'center'}));
    if(c.sub)wrap(c.sub,900,30,500).forEach((l,i)=>text(l,W/2,214+dy+lines.length*68-8+i*40,{size:30,color:'#ffffffa8',align:'center'}));
    ctx.restore();}
}

function backdrop(t){
  ctx.fillStyle=BG;ctx.fillRect(0,0,W,H);
  let g=ctx.createRadialGradient(W*.85,H*.12,0,W*.85,H*.12,900);g.addColorStop(0,'#6559d533');g.addColorStop(1,'#6559d500');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  g=ctx.createRadialGradient(W*.1,H*.85,0,W*.1,H*.85,900);g.addColorStop(0,'#83d9b524');g.addColorStop(1,'#83d9b500');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // drifting rings — a nod to the round notes
  ctx.save();ctx.strokeStyle='#83d9b5';for(let i=0;i<6;i++){const a=i*1.7+t*.12,x=W/2+Math.cos(a)*(380+i*40),y=H/2+Math.sin(a*1.3)*(760-i*50),r=40+i*22;ctx.globalAlpha=.05+.02*(i%2);ctx.lineWidth=3;circle(x,y,r);ctx.stroke();}ctx.restore();
}

// ---------- timeline ----------
function scene(t){
  backdrop(t);

  // 0 — 3.4  title card
  const titleK=1-seg(t,2.7,3.2);
  if(titleK>0){ctx.save();ctx.globalAlpha=titleK;
    const k=out(seg(t,.1,1));const cx=W/2,cy=760,r=260;
    ctx.save();ctx.shadowColor=ACCENT;ctx.shadowBlur=60;ring(cx,cy,r+18,ease(seg(t,.3,2.6)),{width:9,track:'#ffffff14'});ctx.restore();
    ctx.save();ctx.globalAlpha*=k;ctx.translate(cx,cy);ctx.scale(lerp(.8,1,back(k)),lerp(.8,1,back(k)));friend(0,0,r,t,{talk:.6});ctx.restore();
    const k2=out(seg(t,.7,1.5));text('Cipherion',W/2,1180+(1-k2)*30,{size:40,weight:700,color:ACCENT,align:'center',alpha:k2});
    text('Видео-кружочки',W/2,1290+(1-k2)*30,{size:96,weight:800,align:'center',alpha:k2});
    const k3=out(seg(t,1.2,2));text('Скажите всё лицом к лицу — за пару секунд',W/2,1370+(1-k3)*20,{size:36,color:'#ffffffa8',align:'center',alpha:k3});
    if(logo.complete&&logo.naturalWidth){ctx.globalAlpha*=k2;ctx.drawImage(logo,W/2-70,1540,140,140);}
    ctx.restore();}

  if(t<3.1)return;
  caption(t,[
    {a:3.3,b:7.6,kicker:'ШАГ 1',title:'Тап по кнопке записи',sub:'Микрофон превращается в камеру — включён режим кружочка'},
    {a:7.6,b:13.6,kicker:'ШАГ 2',title:'Удерживайте и говорите',sub:'Вверх — закрепить запись, влево — отменить'},
    {a:13.6,b:15.8,kicker:'ШАГ 3',title:'Отправить — в один тап',sub:'Кружок сразу появляется в чате'},
    {a:15.8,b:21.4,kicker:'ПРОСМОТР',title:'Кружок растёт прямо в чате',sub:'Тап — играет со звуком и кольцом прогресса. По краю — перемотка, в центр — пауза'},
    {a:21.4,b:24.4,kicker:'РАСШИФРОВКА',title:'Не можете слушать? Прочитайте',sub:'Кружочек превращается в текст одной кнопкой'},
  ]);

  // phone enters at 3.2, leaves at 24.2
  const enter=out(seg(t,3.35,4.2)),leave=ease(seg(t,24.1,24.9));
  if(leave>=1){outro(t);return;}
  ctx.save();ctx.globalAlpha=enter*(1-leave);ctx.translate(0,(1-enter)*240+leave*120);

  // state from time
  const tapMode=5.0,hold=8.0,lockAt=10.6,sendAt=12.9,arrive=13.3,playAt=16.6,seekAt=18.9,pauseAt=20.3,transAt=22.0;
  const recK=seg(t,hold+.35,hold+.65)*(1-seg(t,sendAt+.1,sendAt+.4));
  const recSeconds=t<hold+.4?0:Math.min(27,(Math.min(t,sendAt)-hold-.4)*6);
  const sent=t>=arrive;
  const noteGrow=out(seg(t,playAt+.05,playAt+.4));
  // playback position (seconds) inside the 27s note
  let pos=0;if(t>playAt){pos=(t-playAt)*1.6;if(t>seekAt)pos=17+(t-seekAt)*1.6;if(t>pauseAt)pos=17+(pauseAt-seekAt)*1.6;}
  pos=Math.min(pos,27);
  const pausedK=seg(t,pauseAt,pauseAt+.15);
  const transK=out(seg(t,transAt+.2,transAt+.7));
  const scroll=lerp(0,sent?180:0,out(seg(t,arrive,arrive+.5)))+noteGrow*70;

  let fingerPos=null;
  phone(t,()=>{
    chatScreen(t,{
      scroll,
      modeMorph:ease(seg(t,tapMode+.25,tapMode+.5)),
      recPressed:t>hold&&t<sendAt+.2&&!(t>lockAt+.4)?out(seg(t,hold,hold+.2)):0,
      recRipple:seg(t,tapMode,tapMode+.6),
      chat:()=>{
        if(!sent)return;
        const r=lerp(100,159,noteGrow),cx=PW-16-r,cy=360+r;
        const fly=1-out(seg(t,arrive,arrive+.45));
        ctx.save();if(fly>0){ctx.translate(0,fly*80);ctx.globalAlpha*=1-fly*.5;}
        chatNote(cx,cy,r,t,{playing:noteGrow,progress:pos/27,remaining:t>playAt?27-pos:27,paused:pausedK,talk:t>playAt&&t<pauseAt?1:0,status:t>arrive+.8?'sent':'pending'});
        ctx.restore();
        // transcribe chip + transcript
        const chipY=cy+r+28;ctx.font=font(13,600);const label='Расшифровать',cw=ctx.measureText(label).width+44;
        ctx.save();ctx.globalAlpha*=seg(t,arrive+.6,arrive+1);ctx.fillStyle=t>transAt?'#83d9b533':'#ffffff14';rr(PW-16-cw,chipY-15,cw,30,15);ctx.fill();icon('text',PW-16-cw+18,chipY,15,ACCENT);text(label,PW-16-cw+32,chipY+4.5,{size:13,weight:600,color:ACCENT});ctx.restore();
        if(transK>0){const full='Смотри, какой закат! Мы на набережной, приходи — тут очень красиво.';const shown=full.slice(0,Math.floor(full.length*seg(t,transAt+.3,transAt+1.2)));
          ctx.save();ctx.globalAlpha*=transK;const lines=wrap(full,250,14.5,500),bh=lines.length*20+22;bubble(PW-16-280,chipY+26,280,bh,true);
          let left=shown;wrap(full,250,14.5,500).forEach((l,i)=>{const part=left.slice(0,l.length);left=left.slice(l.length+1);text(part,PW-16-266,chipY+50+i*20,{size:14.5});});ctx.restore();}
        if(t>playAt-.6&&t<transAt+.5){const tap=t<playAt?[cx,cy,playAt]:t<seekAt?[cx+r*.98,cy+r*.18,seekAt]:t<pauseAt?[cx,cy,pauseAt]:[PW-16-cw/2,chipY,transAt];fingerPos={x:tap[0],y:tap[1]-scroll,tAt:tap[2]};}
      }
    });
    toast('Режим видео-кружочка',Math.min(seg(t,tapMode+.3,tapMode+.6),1-seg(t,7,7.3)));
    const rec=recorder(t,recK,{progress:recSeconds/180,seconds:recSeconds,locked:t>lockAt+.35,talk:t>hold+.8?1:0,sendPress:seg(t,sendAt-.1,sendAt)*(1-seg(t,sendAt,sendAt+.15)),sendRipple:seg(t,sendAt,sendAt+.5)});
    // finger choreography (screen coordinates inside the phone)
    const btn=[350,PH-40];
    if(t>tapMode-.7&&t<tapMode+.6)drawFinger(btn[0],btn[1],seg(t,tapMode-.1,tapMode)*(1-seg(t,tapMode+.1,tapMode+.25)),Math.min(seg(t,tapMode-.7,tapMode-.4),1-seg(t,tapMode+.3,tapMode+.6)));
    if(t>hold-.6&&t<lockAt+.8){const up=ease(seg(t,lockAt-.2,lockAt+.3));drawFinger(btn[0],btn[1]-up*70,t<lockAt+.35?out(seg(t,hold-.1,hold+.1)):0,Math.min(seg(t,hold-.6,hold-.3),1-seg(t,lockAt+.4,lockAt+.8)));}
    if(rec&&t>sendAt-.7&&t<sendAt+.5)drawFinger(rec.cx+98,rec.ay,seg(t,sendAt-.1,sendAt)*(1-seg(t,sendAt+.1,sendAt+.25)),Math.min(seg(t,sendAt-.7,sendAt-.4),1-seg(t,sendAt+.2,sendAt+.5)));
    if(fingerPos){const {x,y,tAt}=fingerPos;drawFinger(x,y,seg(t,tAt-.1,tAt)*(1-seg(t,tAt+.1,tAt+.25)),Math.min(seg(t,tAt-.6,tAt-.35),1-seg(t,tAt+.2,tAt+.5)));ripple(x,y,seg(t,tAt,tAt+.5));}
  });
  ctx.restore();
}
function drawFinger(x,y,press,alpha){finger(x,y+10,press,alpha);}

function outro(t){
  const k=out(seg(t,24.9,25.7));ctx.save();ctx.globalAlpha*=k;
  const cx=W/2,cy=620,r=210;ctx.save();ctx.shadowColor=ACCENT;ctx.shadowBlur=50;ring(cx,cy,r+16,1,{width:8});ctx.restore();
  ctx.save();ctx.translate(cx,cy);ctx.scale(lerp(.85,1,back(k)),lerp(.85,1,back(k)));friend(0,0,r,t,{talk:0});ctx.restore();
  text('Видео-кружочки',W/2,1010,{size:92,weight:800,align:'center'});
  const items=['Запись до 3 минут, с VIP — до 10','Просмотр прямо в чате, без лишних окон','Перемотка по кольцу и расшифровка в текст'];
  items.forEach((s,i)=>{const kk=out(seg(t,25.2+i*.2,25.7+i*.2));ctx.save();ctx.globalAlpha*=kk;ctx.fillStyle=ACCENT;circle(170,1110+i*72-11+(1-kk)*16,9);ctx.fill();text(s,200,1110+i*72+(1-kk)*16,{size:38,weight:500,color:'#ffffffd8'});ctx.restore();});
  if(logo.complete&&logo.naturalWidth)ctx.drawImage(logo,W/2-80,1450,160,160);
  text('Уже в Cipherion',W/2,1700,{size:40,weight:700,color:ACCENT,align:'center'});
  ctx.restore();
}

window.DURATION=DURATION;
window.frame=t=>{ctx.clearRect(0,0,W,H);scene(t);};
window.ready=Promise.all([document.fonts.load(font(20,800)),document.fonts.load(font(20,500)),new Promise(r=>{if(logo.complete)r();else{logo.onload=r;logo.onerror=r;}})]);
const preview=new URLSearchParams(location.search).get('t');
window.ready.then(()=>{if(preview!==null)window.frame(+preview);else{const start=performance.now();const loop=()=>{window.frame(((performance.now()-start)/1000)%DURATION);requestAnimationFrame(loop);};loop();}});
</script>
</body>
