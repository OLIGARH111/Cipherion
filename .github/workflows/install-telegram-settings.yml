name: Wire Telegram settings
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire assets
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if 'telegram-settings.css' not in s:
              s=s.replace('<link rel="stylesheet" href="/telegram-v3.css?v=20260901-1">','<link rel="stylesheet" href="/telegram-v3.css?v=20260901-1">\n    <link rel="stylesheet" href="/telegram-settings.css?v=20260902-1">')
          if 'telegram-settings.js' not in s:
              s=s.replace('<script src="/app.js?v=20260901-4"></script>','<script src="/app.js?v=20260901-4"></script>\n    <script src="/telegram-settings.js?v=20260902-1"></script>')
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Wire Telegram settings assets' && git push
