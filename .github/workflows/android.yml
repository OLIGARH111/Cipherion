name: Android APK
on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Signing key (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi
      - name: Build APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../Cipherion.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Cipherion-apk
          path: Cipherion.apk
      - name: Publish to the "android-latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Cipherion для Android
          body: |
            Последняя сборка Android-приложения Cipherion (версия 1.0.${{ github.run_number }}).
            Скачайте Cipherion.apk на телефон и откройте его. Если Android спросит — разрешите установку из этого источника.
          files: Cipherion.apk
          make_latest: true
      - name: Put the update on the site (main only)
        if: github.ref == 'refs/heads/main'
        env:
          RUN: ${{ github.run_number }}
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          mkdir -p public/android
          cp Cipherion.apk public/android/Cipherion.apk
          NOTES=$(printf '%s' "$MESSAGE" | head -n1)
          node -e 'const [code,notes]=process.argv.slice(1);console.log(JSON.stringify({versionCode:+code,versionName:"1.0."+code,url:"/android/Cipherion.apk",notes},null,2))' "$RUN" "$NOTES" > public/android/version.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/android
          git commit -m "Android 1.0.$RUN: APK для обновления в приложении [skip ci]"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done
