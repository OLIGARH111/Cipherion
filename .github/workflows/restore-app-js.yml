name: Fix registration redirect

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    if: github.actor == 'OLIGARH111'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch registration without replacing app.js
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('app.js')
          text = p.read_text(encoding='utf-8')

          # Make registration impossible to submit as a native HTML form.
          text = text.replace("registerForm.addEventListener('submit', async (e) => {\n    e.preventDefault();\n    e.stopPropagation();", "registerForm.addEventListener('submit', async (e) => {\n    e.preventDefault();\n    e.stopImmediatePropagation();")

          # Ensure successful registration switches screens in-place and does not navigate.
          text = text.replace('saveAuth(data);\n        showApp();', 'saveAuth(data);\n        authScreen.classList.add(\'hidden\');\n        appScreen.classList.remove(\'hidden\');\n        await showApp();', 1)

          p.write_text(text, encoding='utf-8')

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git diff --cached --quiet || git commit -m "Fix registration redirect to chats"
          git push
