name: Build iOS app
on:
  push:
    paths: ['ios/**', '.github/workflows/ios.yml']
  pull_request:
    paths: ['ios/**', '.github/workflows/ios.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen
        working-directory: ios
      # Compile check only; a signed build needs an Apple Developer account (see ios/README.md).
      - run: xcodebuild -project Cipherion.xcodeproj -scheme Cipherion -configuration Release -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO build
        working-directory: ios
